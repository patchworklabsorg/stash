# Local Postgres for development and tests, on port 5436 so it does not collide with Quilt's (5435).
# The database stands in for patchwork-central; Stash owns the "stash" schema in it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash
      POSTGRES_DB: patchwork_central_development
    ports:
      - "5436:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
