name: Image

# Builds the production image (Dockerfile). A pull request only builds it, to prove that it
# builds. A push to main also pushes it to ghcr.io as :<sha> and :main.
#
# There is no deploy step. The NixOS module in patchworklabsorg/infra runs the image, and the
# deploy step comes with that module. See docs/deploy.md.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The lab hosts are x86_64. One platform keeps the build short: the image carries Chromium
      # and LibreOffice.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/patchworklabsorg/stash:${{ github.sha }}
            ghcr.io/patchworklabsorg/stash:main
          cache-from: type=gha,scope=stash
          cache-to: type=gha,mode=max,scope=stash
