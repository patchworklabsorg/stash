name: Herb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'app/views/**/*.html.erb'
      - 'app/views/**/*.turbo_stream.erb'
      - '.herb.yml'

jobs:
  lint:
    name: Lint ERB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with herb
        run: npx --yes @herb-tools/linter

  format:
    name: Format check ERB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting with herb
        run: npx --yes @herb-tools/formatter --check
